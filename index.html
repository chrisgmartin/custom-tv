<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title data-i18n="Home">Início</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="sky" width="1920" height="1080"></canvas>
    <div id="landscape" aria-hidden="true">
      <div class="landscape-layer"></div>
      <div class="landscape-layer"></div>
      <div class="landscape-haze"></div>
    </div>
    <canvas id="precip" width="1920" height="1080"></canvas>
    <div class="flash" id="flash"></div>
    <div class="scrim" id="scrim"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark" data-icon="spark"></span><span id="scopeLabel" data-i18n="Home">Início</span></div>
      <nav class="tabs" role="tablist">
        <button class="tab focusable on" data-scope="home" data-i18n="Home">Início</button>
        <button class="tab focusable" data-scope="inputs" data-i18n="Inputs">Entradas</button>
        <button class="tab focusable" data-scope="apps-page" data-i18n="Apps">Aplicações</button>
        <button class="tab focusable" data-scope="settings" data-i18n="Settings">Definições</button>
      </nav>
      <div class="chrome-right">
        <div class="place" id="place"></div>
        <div class="divider"></div>
        <div class="clock" id="clock"></div>
        <div class="divider"></div>
        <button class="icon-btn focusable" data-action="ambient" data-icon="image" data-i18n-label="Ambient mode" aria-label="Modo ambiente"></button>
      </div>
    </header>

    <main id="home" class="scope">
      <section class="hero">
        <div class="greeting">
          <div class="date" id="date"></div>
          <h1 id="greet"></h1>
          <p class="sub" id="sub"></p>
          <p class="sun" id="sunline"></p>
        </div>
        <div class="weather focusable" id="weather" data-action="forecast">
          <div class="wx-main">
            <div class="wx-icon" id="wxIcon"></div>
            <div class="wx-temp" id="wxTemp">--°</div>
            <div class="wx-text">
              <div class="wx-cond" id="wxCond" data-i18n="Loading weather…">A carregar a meteorologia…</div>
              <div class="wx-hilo" id="wxHilo"></div>
            </div>
          </div>
          <div class="wx-details" id="wxDetails"></div>
          <div class="wx-hours" id="wxHours"></div>
        </div>
      </section>

      <section class="apps">
        <div class="grid-viewport"><div class="grid" id="grid"></div></div>
      </section>
    </main>

    <section id="inputs" class="scope page" hidden>
      <div class="page-head">
        <h2 data-i18n="Inputs">Entradas</h2>
        <p class="page-sub" id="inputsSub"></p>
      </div>
      <div class="inputs-row" id="inputsRow"></div>
      <div class="inputs-note" id="inputsNote"></div>
    </section>

    <section id="apps-page" class="scope page" hidden>
      <div class="page-head">
        <h2 data-i18n="Apps">Aplicações</h2>
        <div class="chips" id="appChips"></div>
      </div>
      <div class="big-grid" id="bigGrid"></div>
    </section>

    <section id="forecast" class="overlay scope" hidden>
      <div class="panel forecast-panel">
        <div class="panel-head">
          <div>
            <div class="eyebrow" id="fcPlace"></div>
            <h3 data-i18n="7-day forecast">Previsão para 7 dias</h3>
          </div>
          <button class="pill-btn focusable" data-action="close" data-i18n="Close">Fechar</button>
        </div>
        <div class="fc-days" id="fcDays"></div>
        <div class="fc-facts" id="fcFacts"></div>
      </div>
    </section>

    <section id="settings" class="scope page" hidden>
      <div class="page-head">
        <h2 data-i18n="Settings">Definições</h2>
        <p class="page-sub" data-i18n="Changes save as you make them">As alterações guardam-se automaticamente</p>
      </div>
      <div class="settings-body">
        <div class="settings-col" id="prefs"></div>
        <div class="settings-col">
          <div class="col-title"><strong data-i18n="Apps on Home">Aplicações no início</strong> <span data-i18n="Press OK to show or hide">Prima OK para mostrar ou ocultar</span></div>
          <div class="app-list" id="appList"></div>
        </div>
      </div>
    </section>

    <section id="ambient" class="ambient scope" hidden>
      <div class="amb-time" id="ambTime"></div>
      <div class="amb-date" id="ambDate"></div>
      <div class="amb-wx" id="ambWx"></div>
      <button class="focusable amb-exit" data-action="close" data-i18n-label="Exit ambient mode" aria-label="Sair do modo ambiente"></button>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/config.local.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/landscape.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
